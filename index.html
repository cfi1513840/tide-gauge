<!DOCTYPE html>
<html>
<style type="text/css">
<!--
   .tab {margin-left: 110px;}
-->
.center-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-size: 1.5em; 
}
.dirtab {
   text-indent: 33%;
}
.info-block {
   display: none;
   width: 100%;
   box-sizing: border-box;
   background-color: #FFFFFF;
   border: 2px solid #1B3A5C;
   border-radius: 8px;
   padding: 14px 18px;
   margin: 16px 0;
   font-family: 'Fraunces', Georgia, serif;
   font-style: italic;
   font-size: 0.62em;
   line-height: 1.5;
   text-align: left;
   color: #1B3A5C;
   white-space: pre-wrap;
}
.nav-buttons button {
   font-family: "Arial", "Helvetica", sans-serif;
   font-size: 0.6em;
   font-weight: bold;
   color: #1B3A5C;
   background-color: #FFFFFF;
   border: 2px solid #1B3A5C;
   border-radius: 20px;
   padding: 10px 22px;
   margin: 6px;
   cursor: pointer;
}
.nav-buttons button:hover {
   background-color: #1B3A5C;
   color: #FFFFFF;
}
.nav-desc {
   font-size: 0.62em;
   color: #1B3A5C;
   margin: 0 0 14px 0;
}
.nav-subtext {
   font-size: 0.62em;
   font-weight: bold;
   margin: -8px 0 16px 0;
}
.nav-subtext a {
   color: #1C6E7A;
   text-decoration: underline;
}
.nav-subtext a:hover {
   color: #1B3A5C;
}
.card-footer {
   text-align: center;
   margin-top: 12px;
   padding-top: 14px;
   border-top: 1px solid #BFDEDC;
   font-size: 0.62em;
   font-weight: bold;
}
.card-footer a {
   color: #1C6E7A;
   text-decoration: underline;
}
.card-footer a:hover {
   color: #1B3A5C;
}
</style>
<head>
   <title>Tide Station Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,400&display=swap">
</head>
  <body bgcolor="black">
    <div class="center-screen" >
    <span style="border:8px double #1B3A5C; box-sizing: border-box; width: 650px; padding: 25px;
      background-color: #E3F1F0;">
    <img src="/webimage.png"
         style="width: 560px; height: 350px; object-fit: contain; background-color: #FFFFFF;"/>
      <h1 id="site-title" style="width: 560px;
        text-align: center;
        font-size: 25px;
        font-color: black;
        padding: 4px;
        ">Tide Station Hub</h1>

      <div id="info-block" class="info-block"></div>

      <p>
      <form action="/cgi-bin/alertform.cgi" method="post">
        <div class="nav-buttons">
            <button type="submit" formaction="/tide.html">Tidal Conditions</button><br>
            <p class="nav-desc">Current and predicted tide and weather graphics</p>
            <button type="submit" formaction="/alertlogin.html">Request Alerts</button><br>
            <p class="nav-desc">Alert notifications based on changing conditions</p>
            <p class="nav-subtext"><a href="/alert_tutorial.html">New to alerts? Read the quick guide &rarr;</a></p>
            <button type="submit" formaction="/tideplot.html">Historical Analysis</button><br>
            <p class="nav-desc">Plot tide and weather for specified time intervals</p>
        </div>
      </form></p>
      <div class="card-footer">
        <a href="/ACTION_Technical_Manual.pdf">Technical documentation for site administrators</a>
      </div>
    </span>
    </div>
    <script>
      fetch('/webinfo.txt')
        .then(function(response) {
          if (!response.ok) { throw new Error('not found'); }
          return response.text();
        })
        .then(function(text) {
          if (text.trim() === '') { return; }
          var block = document.getElementById('info-block');
          block.textContent = text;
          block.style.display = 'block';
        })
        .catch(function() {
          // webinfo.txt not present or unreadable -- leave the info block hidden
        });

      fetch('/cgi-bin/sitename.cgi')
        .then(function(response) {
          if (!response.ok) { throw new Error('not found'); }
          return response.text();
        })
        .then(function(text) {
          var location = text.trim();
          if (location === '') { return; }
          var titleEl = document.getElementById('site-title');
          var newTitle = location + ' Tide Station Hub';
          titleEl.textContent = newTitle;
          document.title = newTitle;
        })
        .catch(function() {
          // sitename.cgi not present/unreadable, or STATION_LOCATION unset --
          // leave the generic "Tide Station Hub" title as-is
        });
    </script>
  </body>
</html>
